        desc: '세계 여행과 에세이 서적에 몰입하며 음료나 와인을 곁들일 수 있는 고요한 사색 공간입니다.',
        kakaoQuery: '책계일주'
      },
      {
        id: 'book-2',
        cat: 'book',
        catName: '독립서점',
        icon: '📖',
        name: '라바북스 (LABAS BOOKS)',
        tag: '차로 18분 · 1세대 독립출판물 서점',
        time: '18분',
        lat: 33.2730,
        lng: 126.6635,
        surface: '위미리 바닷마을 독립서점',
        desc: '국내외 독립출판물, 사진집, 예술 잡지 큐레이션이 돋보이는 곳. 홀로 영감을 채우기 좋습니다.',
        kakaoQuery: '라바북스'
      },
      {
        id: 'book-3',
        cat: 'book',
        catName: '독립서점',
        icon: '📖',
        name: '소심한책방',
        tag: '차로 28분 · 종달리 북 큐레이션',
        time: '28분',
        lat: 33.4980,
        lng: 126.9030,
        surface: '종달리 돌담 골목 서점',
        desc: '책방지기의 손글씨 소개와 다정한 인문·문학 서적이 있는 종달리의 대표 책방입니다.',
        kakaoQuery: '소심한책방'
      }
    ];

    // 카테고리별 색상 매핑
    const CAT_COLORS = {
      walk: { bg: 'bg-emerald-100', text: 'text-emerald-800', border: 'border-emerald-300', marker: '#2E7D32' },
      beach: { bg: 'bg-sky-100', text: 'text-sky-800', border: 'border-sky-300', marker: '#0277BD' },
      trip: { bg: 'bg-amber-100', text: 'text-amber-800', border: 'border-amber-300', marker: '#E65100' },
      bakery: { bg: 'bg-orange-100', text: 'text-orange-800', border: 'border-orange-300', marker: '#D84315' },
      book: { bg: 'bg-indigo-100', text: 'text-indigo-800', border: 'border-indigo-300', marker: '#4527A0' }
    };

    // 2. 지도 초기화 (Leaflet)
    let map = L.map('map', {
      zoomControl: false,
      attributionControl: false
    }).setView([33.370, 126.780], 12);

    L.control.zoom({ position: 'topright' }).addTo(map);

    // 심플하고 차분한 CartoDB Positron 타일 레이어
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      maxZoom: 19
    }).addTo(map);

    // 3. 이동시간 동심원 (5분 ~3km / 15분 ~10km / 30분 ~20km)
    const ring5 = L.circle(HOME_COORDS, { radius: 3000, color: '#10B981', weight: 1.5, dashArray: '4, 4', fill: true, fillColor: '#10B981', fillOpacity: 0.03 }).addTo(map);
    const ring15 = L.circle(HOME_COORDS, { radius: 10000, color: '#F59E0B', weight: 1.5, dashArray: '5, 5', fill: true, fillColor: '#F59E0B', fillOpacity: 0.02 }).addTo(map);
    const ring30 = L.circle(HOME_COORDS, { radius: 20000, color: '#3B82F6', weight: 1.5, dashArray: '6, 6', fill: false }).addTo(map);

    // 4. 우리 집(HOME) 마커 생성
    const homeIcon = L.divIcon({
      className: 'home-marker',
      html: `
        <div class="relative flex items-center justify-center">
          <span class="animate-ping absolute inline-flex h-10 w-10 rounded-full bg-emerald-400 opacity-60"></span>
          <div class="w-10 h-10 rounded-full bg-emerald-700 text-white flex items-center justify-center shadow-lg border-2 border-white text-base font-bold z-10">
            🏡
          </div>
        </div>
      `,
      iconSize: [40, 40],
      iconAnchor: [20, 20]
    });

    const homeMarker = L.marker(HOME_COORDS, { icon: homeIcon }).addTo(map);
    homeMarker.bindPopup(`
      <div class="text-center font-sans p-1">
        <p class="text-xs text-emerald-700 font-bold tracking-wider">우리 집 (HOME)</p>
        <p class="font-extrabold text-stone-900 text-sm mt-0.5">가시리 녹산로 5번길</p>
        <p class="text-[11px] text-stone-500 mt-1">이곳을 기점으로 5·15·30분 동심원 표기</p>
      </div>
    `);

    // 5. 플레이스 마커 생성 & 렌더링
    const markerGroup = L.layerGroup().addTo(map);
    const markersById = {};

    function createPlaceMarker(place) {
      const colors = CAT_COLORS[place.cat];
      const customIcon = L.divIcon({
        className: `place-marker-${place.id}`,
        html: `
          <div class="cursor-pointer group hover:scale-110 transition-transform">
            <div class="w-8 h-8 rounded-full flex items-center justify-center text-sm shadow-md border-2 border-white" style="background-color: ${colors.marker}; color: white;">
              ${place.icon}
            </div>
          </div>
        `,
        iconSize: [32, 32],
        iconAnchor: [16, 16]
      });

      const marker = L.marker([place.lat, place.lng], { icon: customIcon });

      const popupHtml = `
        <div class="font-sans text-stone-800 min-w-[210px] p-1">
          <div class="flex items-center justify-between border-b border-stone-100 pb-1.5 mb-1.5">
            <span class="text-xs font-semibold px-2 py-0.5 rounded-full ${colors.bg} ${colors.text}">
              ${place.catName} · ${place.time}
            </span>
          </div>
          <h3 class="font-bold text-sm text-stone-900">${place.name}</h3>
          <p class="text-xs text-stone-600 mt-1 leading-snug">${place.desc}</p>
          <div class="mt-2.5 pt-2 border-t border-stone-100 flex items-center justify-between">
            <span class="text-[11px] text-emerald-700 font-medium">🐾 ${place.surface}</span>
            <a href="https://map.kakao.com/link/search/${encodeURIComponent(place.kakaoQuery)}" target="_blank" class="text-[11px] bg-stone-900 text-white px-2 py-1 rounded hover:bg-stone-800 transition">길찾기</a>
          </div>
        </div>
      `;

      marker.bindPopup(popupHtml);

      marker.on('click', () => {
        highlightCard(place.id);
      });

      return marker;
    }

    // 6. UI 카드 렌더링
    const cardsContainer = document.getElementById('cards-container');

    function renderCards(placesToRender) {
      cardsContainer.innerHTML = '';
      markerGroup.clearLayers();

      if (placesToRender.length === 0) {
        cardsContainer.innerHTML = `
          <div class="p-8 text-center text-stone-400 text-xs">
            해당 카테고리의 장소가 없습니다.
          </div>
        `;
        return;
      }

      placesToRender.forEach(place => {
        const colors = CAT_COLORS[place.cat];

        // 마커 등록
        const marker = createPlaceMarker(place);
        marker.addTo(markerGroup);
        markersById[place.id] = marker;

        // 카드 생성
        const card = document.createElement('div');
        card.id = `card-${place.id}`;
        card.className = `p-3.5 bg-white rounded-xl border border-stone-200 hover:border-stone-400 shadow-sm transition cursor-pointer card-item`;
        card.innerHTML = `
          <div class="flex items-start justify-between">
            <div class="flex items-center space-x-2">
              <span class="text-base">${place.icon}</span>
              <div>
                <span class="text-[11px] font-semibold px-2 py-0.5 rounded-full ${colors.bg} ${colors.text}">
                  ${place.catName} · ${place.time}
                </span>
                <h2 class="text-sm font-bold text-stone-900 mt-1">${place.name}</h2>
              </div>
            </div>
            <a href="https://map.kakao.com/link/search/${encodeURIComponent(place.kakaoQuery)}" target="_blank" onclick="event.stopPropagation()" class="p-1.5 rounded-lg text-stone-400 hover:text-stone-700 hover:bg-stone-100 transition" title="카카오맵 길찾기">
              <i data-lucide="navigation" class="w-4 h-4"></i>
            </a>
          </div>

          <p class="text-xs text-stone-600 mt-2 leading-relaxed">
            ${place.desc}
          </p>

          <div class="mt-2.5 pt-2 border-t border-stone-100 flex items-center justify-between text-[11px] text-stone-500">
            <span class="flex items-center gap-1 text-emerald-800 font-medium">
              <i data-lucide="check-circle" class="w-3.5 h-3.5 text-emerald-600"></i>
              ${place.surface}
            </span>
          </div>
        `;

        card.addEventListener('click', () => {
          focusPlace(place);
        });

        cardsContainer.appendChild(card);
      });

      lucide.createIcons();
    }

    // 카드 및 지도 포커스 동기화
    function focusPlace(place) {
      map.flyTo([place.lat, place.lng], 13.5, { duration: 0.8 });
      const marker = markersById[place.id];
      if (marker) {
        setTimeout(() => marker.openPopup(), 400);
      }
      highlightCard(place.id);

      // 모바일일 경우 지도로 화면 자동 이동
      if (window.innerWidth < 768) {
        setMobileView('map');
      }
    }

    function highlightCard(id) {
      document.querySelectorAll('.card-item').forEach(c => {
        c.classList.remove('ring-2', 'ring-stone-900', 'bg-stone-50');
      });
      const targetCard = document.getElementById(`card-${id}`);
      if (targetCard) {
        targetCard.classList.add('ring-2', 'ring-stone-900', 'bg-stone-50');
        targetCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    // 홈으로 이동
    function focusHome() {
      map.flyTo(HOME_COORDS, 12, { duration: 0.8 });
      homeMarker.openPopup();
    }

    // 카테고리 필터링
    function filterCategory(cat) {
      // 탭 스타일 갱신
      document.querySelectorAll('.cat-pill').forEach(btn => {
        if (btn.dataset.cat === cat) {
          btn.className = 'cat-pill active px-3 py-1.5 rounded-full font-medium transition bg-stone-900 text-white shadow-sm';
        } else {
          btn.className = 'cat-pill px-3 py-1.5 rounded-full font-medium transition bg-stone-100 text-stone-700 hover:bg-stone-200';
        }
      });

      if (cat === 'all') {
        renderCards(PLACES);
      } else {
        const filtered = PLACES.filter(p => p.cat === cat);
        renderCards(filtered);
      }
    }

    // 모바일 뷰 토글
    function setMobileView(view) {
      const listEl = document.getElementById('sidebar-list');
      const mapEl = document.getElementById('map-container');
      const mapBtn = document.getElementById('view-map-btn');
      const listBtn = document.getElementById('view-list-btn');

      if (view === 'map') {
        listEl.classList.add('hidden');
        mapEl.classList.remove('hidden');
        mapBtn.className = 'px-2.5 py-1 rounded-md bg-white shadow-sm text-stone-900';
        listBtn.className = 'px-2.5 py-1 rounded-md text-stone-500';
        setTimeout(() => map.invalidateSize(), 150);
      } else {
        listEl.classList.remove('hidden');
        mapEl.classList.add('hidden');
        listBtn.className = 'px-2.5 py-1 rounded-md bg-white shadow-sm text-stone-900';
        mapBtn.className = 'px-2.5 py-1 rounded-md text-stone-500';
      }
    }

    // 반응형 초기화
    function initResponsive() {
      if (window.innerWidth < 768) {
        setMobileView('map');
      } else {
        document.getElementById('sidebar-list').classList.remove('hidden');
        document.getElementById('map-container').classList.remove('hidden');
      }
    }

    window.addEventListener('resize', () => {
      if (window.innerWidth >= 768) {
        document.getElementById('sidebar-list').classList.remove('hidden');
        document.getElementById('map-container').classList.remove('hidden');
        map.invalidateSize();
      }
    });

    // 앱 실행
    window.onload = () => {
      renderCards(PLACES);
      initResponsive();
      lucide.createIcons();
    };
  </script>
</body>
</html>
