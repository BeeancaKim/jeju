          </div>

          <p class="text-xs text-stone-600 mt-2 leading-relaxed">${place.desc}</p>

          <div class="mt-2.5 pt-2 border-t border-stone-100 flex items-center justify-between text-[11px] text-stone-500">
            <span class="flex items-center gap-1 text-emerald-800 font-medium">
              <i data-lucide="check-circle" class="w-3.5 h-3.5 text-emerald-600"></i>
              ${place.surface}
            </span>
          </div>
        `;

        card.addEventListener('click', () => focusPlace(place));
        cardsContainer.appendChild(card);
      });

      lucide.createIcons();
    }

    function toggleFarPlaces() {
      isFarEnabled = !isFarEnabled;
      const badge = document.getElementById('far-badge');
      const btn = document.getElementById('toggle-far-btn');

      if (isFarEnabled) {
        badge.innerText = 'ON';
        badge.className = 'bg-purple-600 text-white text-[10px] px-1.5 py-0.2 rounded-full';
        btn.className = 'flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-bold transition border border-purple-600 bg-purple-600 text-white shadow-sm';
        map.flyTo([33.35, 126.65], 10.5, { duration: 1.0 });
      } else {
        badge.innerText = 'OFF';
        badge.className = 'bg-stone-400 text-white text-[10px] px-1.5 py-0.2 rounded-full';
        btn.className = 'flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-bold transition border border-purple-300 bg-purple-50 text-purple-700 hover:bg-purple-100 shadow-sm';
        focusHome();
      }
      renderCards();
    }

    function focusPlace(place) {
      map.flyTo([place.lat, place.lng], 13.5, { duration: 0.8 });
      const marker = markersById[place.id];
      if (marker) {
        setTimeout(() => marker.openPopup(), 400);
      }
      highlightCard(place.id);
      if (window.innerWidth < 768) {
        setMobileView('map');
      }
    }

    function highlightCard(id) {
      document.querySelectorAll('.card-item').forEach(c => {
        c.classList.remove('ring-2', 'ring-stone-900', 'bg-stone-50');
      });
      const targetCard = document.getElementById(`card-${id}`);
      if (targetCard) {
        targetCard.classList.add('ring-2', 'ring-stone-900', 'bg-stone-50');
        targetCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    function focusHome() {
      map.flyTo(HOME_COORDS, 12, { duration: 0.8 });
      homeMarker.openPopup();
    }

    function filterCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-pill').forEach(btn => {
        if (btn.dataset.cat === cat) {
          btn.className = 'cat-pill active px-3 py-1.5 rounded-full font-medium transition bg-stone-900 text-white shadow-sm';
        } else {
          btn.className = 'cat-pill px-3 py-1.5 rounded-full font-medium transition bg-stone-100 text-stone-700 hover:bg-stone-200';
        }
      });
      renderCards();
    }

    function setMobileView(view) {
      const listEl = document.getElementById('sidebar-list');
      const mapEl = document.getElementById('map-container');
      const mapBtn = document.getElementById('view-map-btn');
      const listBtn = document.getElementById('view-list-btn');

      if (view === 'map') {
        listEl.classList.add('hidden');
        mapEl.classList.remove('hidden');
        mapBtn.className = 'px-2.5 py-1 rounded-md bg-white shadow-sm text-stone-900';
        listBtn.className = 'px-2.5 py-1 rounded-md text-stone-500';
        setTimeout(() => map.invalidateSize(), 150);
      } else {
        listEl.classList.remove('hidden');
        mapEl.classList.add('hidden');
        listBtn.className = 'px-2.5 py-1 rounded-md bg-white shadow-sm text-stone-900';
        mapBtn.className = 'px-2.5 py-1 rounded-md text-stone-500';
      }
    }

    function initResponsive() {
      if (window.innerWidth < 768) {
        setMobileView('map');
      } else {
        document.getElementById('sidebar-list').classList.remove('hidden');
        document.getElementById('map-container').classList.remove('hidden');
      }
    }

    window.addEventListener('resize', () => {
      if (window.innerWidth >= 768) {
        document.getElementById('sidebar-list').classList.remove('hidden');
        document.getElementById('map-container').classList.remove('hidden');
        map.invalidateSize();
      }
    });

    window.onload = () => {
      renderCards();
      initResponsive();
      lucide.createIcons();
    };
  </script>
</body>
</html>
